[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gencon-audiobook"
version = "0.1.2"
description = "Download General Conference talks as a complete audiobook (m4b) and epub with full transcripts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "XeroIP"}]
keywords = ["general-conference", "audiobook", "m4b", "epub", "lds", "latter-day-saints"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "mutagen>=1.47",
    "Pillow>=9.1",
    "rich>=13.0",
    "static-ffmpeg>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "responses>=0.23",
    "pip-audit>=2.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-requests>=2.31",
    "types-beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/XeroIP/gencon-audiobook"
Repository = "https://github.com/XeroIP/gencon-audiobook"
"Bug Tracker" = "https://github.com/XeroIP/gencon-audiobook/issues"

[project.scripts]
gencon-audiobook = "gencon_audiobook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gencon_audiobook"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # line length — not enforced

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that hit the real website (deselect with -m 'not live')",
    "integration: marks end-to-end integration tests",
]
